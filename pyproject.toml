[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netwatch"
version = "1.0.0"
description = "Network traffic observability and behavioral anomaly detection for PCAP captures"
requires-python = ">=3.10"
dependencies = [
    "scapy",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]